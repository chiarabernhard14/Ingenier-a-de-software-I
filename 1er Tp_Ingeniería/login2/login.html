<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="login-form">
        <img src="./images/usuario.svg" alt="usuario.img">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ejemplo" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña" required>
        <div class="box visible">
            <input type="checkbox" name="" id="visible">
            <label for="visible">Mostrar Contraseña</label>
        </div>
        <button type="submit" id="submit">Iniciar Sesión</button>
    </form>
    <script src="./login.js"></script>
</body>
</html>
